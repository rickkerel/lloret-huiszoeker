<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lloret Huiszoeker · 24–31 juli</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sea: #0b4f6c; --sea-2: #127a9c; --sand: #f6efe3; --sun: #ff7a3d;
    --ink: #1c2530; --muted: #6b7684; --line: #e6dccb; --ok: #2f9e6b; --warn: #d9822b; --bad: #c4453c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--sand); }
  .app { display: grid; grid-template-columns: 420px 1fr; height: 100vh; }

  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--sand); }
  header { padding: 18px 20px 14px; background: var(--sea); color: #fff; }
  header h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -.5px; }
  header h1 span { color: var(--sun); }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }

  .filters { padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; border-bottom: 1px solid var(--line); }
  .filters label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .filters .full { grid-column: 1 / -1; }
  input[type=search], select, input[type=number] {
    font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); text-transform: none; letter-spacing: 0;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; user-select: none; }
  .chip.on { background: var(--sea); color: #fff; border-color: var(--sea); }
  .count { padding: 8px 20px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }

  .list { overflow-y: auto; padding: 4px 12px 20px; flex: 1; }
  .card { display: grid; grid-template-columns: 116px 1fr; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; margin-bottom: 6px; background: #fff; border: 1px solid transparent; transition: border-color .15s, transform .15s; }
  .card:hover, .card.active { border-color: var(--sea-2); }
  .card img { width: 116px; height: 84px; object-fit: cover; border-radius: 8px; background: var(--line); }
  .card h3 { margin: 0 0 3px; font-size: 15px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; display: flex; justify-content: space-between; gap: 6px; }
  .star { background: none; border: 0; font-size: 18px; cursor: pointer; padding: 0; line-height: 1; color: #c9bda8; }
  .star.on { color: var(--sun); }
  .meta { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .meta b { color: var(--ink); font-weight: 600; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-top: 4px; margin-right: 3px; }
  .tag.ok { background: #e0f3ea; color: var(--ok); } .tag.warn { background: #fbecdc; color: var(--warn); }
  .tag.bad { background: #f7e1df; color: var(--bad); } .tag.neutral { background: #eef0f2; color: var(--muted); }

  #map { height: 100%; }
  .pin { background: var(--sea); color: #fff; font: 700 12px Inter, sans-serif; border-radius: 999px; padding: 4px 8px; white-space: nowrap; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transform: translate(-50%, -50%); position: absolute; }
  .pin.fav { background: var(--sun); }
  .pin.dim { background: #8c97a3; }
  .pin.active { background: var(--ink); z-index: 1000; transform: translate(-50%, -50%) scale(1.2); }
  .leaflet-div-icon { background: none; border: none; }

  .popup { width: 260px; font-family: Inter, sans-serif; }
  .popup .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 4px; border-radius: 8px; }
  .popup .gallery img { width: 260px; height: 146px; object-fit: cover; flex: none; scroll-snap-align: start; }
  .popup h4 { font-family: "Bricolage Grotesque", sans-serif; font-size: 17px; margin: 8px 0 2px; }
  .popup .btn { display: block; text-align: center; margin-top: 8px; padding: 9px; border-radius: 8px; background: var(--sun); color: #fff !important; text-decoration: none; font-weight: 600; }
  .leaflet-popup-content { margin: 10px; }

  .legend { background: #fff; padding: 8px 10px; border-radius: 8px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2); line-height: 1.7; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
    aside { order: 2; border-right: 0; } #map { order: 1; }
    header { padding: 10px 14px; } header h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Lloret <span>Huiszoeker</span></h1>
      <p>24 – 31 juli · villa's van CostaCabana op de kaart</p>
    </header>
    <div class="filters">
      <label class="full">Zoeken
        <input type="search" id="q" placeholder="Naam of wijk, bijv. Fenals">
      </label>
      <label>Min. personen
        <input type="number" id="persons" value="12" min="1" max="40">
      </label>
      <label>Sorteren
        <select id="sort">
          <option value="persons">Meeste personen</option>
          <option value="beach">Dichtst bij strand</option>
          <option value="center">Dichtst bij centrum</option>
          <option value="rating">Beste beoordeling</option>
          <option value="bedrooms">Meeste slaapkamers</option>
        </select>
      </label>
      <label>Plaats
        <select id="town"><option value="">Alle plaatsen</option></select>
      </label>
      <label>Groepsbeleid
        <select id="groups">
          <option value="friends">Vriendengroep mag</option>
          <option value="">Alles tonen</option>
        </select>
      </label>
      <div class="full chips">
        <span class="chip on" data-f="pool">🏊 Zwembad</span>
        <span class="chip" data-f="extra">➕ Extra bedden meetellen</span>
        <span class="chip" data-f="favs">★ Alleen favorieten</span>
      </div>
    </div>
    <div class="count"><span id="count"></span><a href="#" id="share">Deel favorieten</a></div>
    <div class="list" id="list"></div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const BEACH = [41.6977, 2.8460];   // Platja de Lloret (midden)
const CENTER = [41.6995, 2.8456];  // Plaça de la Vila
const FAV_KEY = 'lloret-favs';

const $ = s => document.querySelector(s);
const state = { pool: true, extra: false, favs: false, active: null };
let favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));

// Favorieten kunnen gedeeld worden via ?fav=id1,id2
const shared = new URLSearchParams(location.search).get('fav');
if (shared) { shared.split(',').forEach(id => favs.add(id)); saveFavs(); }

function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }

function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const fmtKm = d => d < 1 ? `${Math.round(d * 1000 / 50) * 50} m` : `${d.toFixed(1)} km`;

const houses = window.HOUSES.map(h => ({
  ...h,
  beach: km([h.lat, h.lng], BEACH),
  center: km([h.lat, h.lng], CENTER),
}));

[...new Set(houses.map(h => h.town))].sort().forEach(t => $('#town').add(new Option(t, t, false, t === 'Lloret de Mar')));

function groupTag(h) {
  const age = h.minAge ? ` · gem. ${h.minAge}+` : '';
  switch (h.groups) {
    case 'groepen ok': return `<span class="tag ok">Groepen welkom${age}</span>`;
    case 'gemengde groepen': return `<span class="tag warn">Alleen gemengde groepen${age}</span>`;
    case 'geen groepen': return `<span class="tag bad">Geen groepen</span>`;
    default: return `<span class="tag neutral">Groepsbeleid: check site</span>`;
  }
}

function filtered() {
  const q = $('#q').value.trim().toLowerCase();
  const min = +$('#persons').value || 0;
  const town = $('#town').value;
  const groups = $('#groups').value;
  const list = houses.filter(h =>
    (state.extra ? h.personsMax : h.persons) >= min &&
    (!town || h.town === town) &&
    (!state.pool || h.pool) &&
    (!state.favs || favs.has(h.id)) &&
    (groups !== 'friends' || h.groups !== 'geen groepen') &&
    (!q || `${h.name} ${h.area} ${h.town}`.toLowerCase().includes(q))
  );
  const by = {
    persons: (a, b) => b.persons - a.persons || a.beach - b.beach,
    beach: (a, b) => a.beach - b.beach,
    center: (a, b) => a.center - b.center,
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || b.reviews - a.reviews,
    bedrooms: (a, b) => b.bedrooms - a.bedrooms,
  }[$('#sort').value];
  return list.sort(by);
}

// ---------- Kaart ----------
const map = L.map('map', { zoomControl: false }).setView([41.703, 2.845], 14);
L.control.zoom({ position: 'topright' }).addTo(map);
const CARTO_KEY = 'cb1_3m37_1_94fd0036e892ecc35d0d9953';
L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>',
}).addTo(map);

L.marker(BEACH, { icon: L.divIcon({ html: '<div style="font-size:22px;transform:translate(-50%,-50%);position:absolute">🏖️</div>' }) })
  .addTo(map).bindTooltip('Platja de Lloret');

const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => Object.assign(L.DomUtil.create('div', 'legend'), {
  innerHTML: '<i style="background:#0b4f6c"></i>Past bij filters<br><i style="background:#ff7a3d"></i>Favoriet<br>Getal = max. personen',
});
legend.addTo(map);

const markers = {};
function popupHtml(h) {
  const beds = Object.entries(h.beds).map(([k, v]) => `${v}× ${{ Single: 'enkel', Double: 'dubbel', King: 'kingsize', Queen: 'queen', Sofa: 'slaapbank', SofaBed: 'slaapbank', Bunk: 'stapelbed' }[k] || k}`).join(', ');
  return `<div class="popup">
    <div class="gallery">${h.images.map(i => `<img loading="lazy" src="${i}">`).join('')}</div>
    <h4>${h.name}</h4>
    <div class="meta">
      <b>${h.persons}${h.personsMax > h.persons ? `–${h.personsMax}` : ''} pers.</b> · ${h.bedrooms} slpk · ${h.bathrooms} badk${h.m2 ? ` · ${h.m2} m²` : ''}<br>
      ${h.pool ? '🏊 Privézwembad' : 'Geen zwembad'}${h.aircoPaid ? ' · airco tegen betaling' : ''}<br>
      🏖️ ${fmtKm(h.beach)} tot strand · 📍 ${h.area || h.town}<br>
      ${beds ? `🛏️ ${beds}<br>` : ''}
      ${h.rating ? `⭐ ${h.rating} (${h.reviews} reviews)<br>` : ''}
      ${groupTag(h)}
    </div>
    <a class="btn" href="${h.url}" target="_blank" rel="noopener">Check 24–31 juli op CostaCabana →</a>
  </div>`;
}

function pinIcon(h) {
  const cls = ['pin', favs.has(h.id) && 'fav', state.active === h.id && 'active'].filter(Boolean).join(' ');
  return L.divIcon({ html: `<div class="${cls}">${h.persons}</div>`, iconSize: [0, 0] });
}

function select(id, pan) {
  const prev = state.active;
  state.active = id;
  [prev, id].forEach(x => x && markers[x] && markers[x].setIcon(pinIcon(houses.find(h => h.id === x))));
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  const m = markers[id];
  if (m && pan) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup(); }
  document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ---------- Lijst ----------
function render(fit) {
  const list = filtered();
  const ids = new Set(list.map(h => h.id));

  for (const [id, m] of Object.entries(markers)) if (!ids.has(id)) { map.removeLayer(m); delete markers[id]; }
  for (const h of list) {
    if (markers[h.id]) { markers[h.id].setIcon(pinIcon(h)); continue; }
    markers[h.id] = L.marker([h.lat, h.lng], { icon: pinIcon(h), riseOnHover: true })
      .bindPopup(() => popupHtml(h), { maxWidth: 280 })
      .on('click', () => select(h.id, false))
      .addTo(map);
  }

  $('#count').textContent = `${list.length} ${list.length === 1 ? 'huis' : 'huizen'} gevonden`;
  $('#list').innerHTML = list.map(h => `
    <div class="card ${state.active === h.id ? 'active' : ''}" data-id="${h.id}">
      <img loading="lazy" src="${h.images[0] || ''}" alt="">
      <div>
        <h3>${h.name}<button class="star ${favs.has(h.id) ? 'on' : ''}" data-star="${h.id}" title="Favoriet">★</button></h3>
        <div class="meta">
          <b>${h.persons}${h.personsMax > h.persons ? `–${h.personsMax}` : ''} pers.</b> · ${h.bedrooms} slpk · ${h.bathrooms} badk${h.pool ? ' · 🏊' : ''}<br>
          🏖️ ${fmtKm(h.beach)} · ${h.area || h.town}${h.rating ? ` · ⭐ ${h.rating}` : ''}
        </div>
        ${groupTag(h)}
      </div>
    </div>`).join('') || '<p class="meta" style="padding:20px">Niets gevonden. Probeer minder filters.</p>';

  if (fit && list.length) map.fitBounds(L.latLngBounds(list.map(h => [h.lat, h.lng])), { padding: [40, 40], maxZoom: 16 });
}

$('#list').addEventListener('click', e => {
  const star = e.target.closest('[data-star]');
  if (star) {
    const id = star.dataset.star;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    saveFavs(); render(false); return;
  }
  const card = e.target.closest('.card');
  if (card) select(card.dataset.id, true);
});

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  state[c.dataset.f] = !state[c.dataset.f];
  c.classList.toggle('on', state[c.dataset.f]);
  render(true);
}));
['#q', '#persons'].forEach(s => $(s).addEventListener('input', () => render(true)));
['#sort', '#town', '#groups'].forEach(s => $(s).addEventListener('change', () => render(s !== '#sort')));

$('#share').addEventListener('click', async e => {
  e.preventDefault();
  if (!favs.size) return alert('Markeer eerst een paar huizen met ★');
  const text = [...favs].map(id => houses.find(h => h.id === id)).filter(Boolean)
    .map(h => `★ ${h.name} (${h.persons} pers.) – ${h.url}`).join('\n');
  await navigator.clipboard.writeText(`Onze favorieten voor Lloret, 24–31 juli:\n${text}`);
  alert('Gekopieerd! Plak het in de groepsapp.');
});

render(true);
</script>
</body>
</html>
