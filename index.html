<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lloret Huiszoeker · 24–31 juli</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #ff7a3d; --gold: #c9a24a; --ink: #17202a; --muted: #6b7684;
    --line: #e7e9ec; --bg: #f6f6f4; --ok: #2f9e6b; --warn: #c7771f; --bad: #c4453c;
    --radius: 12px; --side: 440px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  .app { display: grid; grid-template-columns: var(--side) 1fr; height: 100vh; height: 100dvh; transition: grid-template-columns .25s ease; }
  .app.collapsed { grid-template-columns: 0 1fr; }
  .app.collapsed aside { border-right: 0; }

  /* ---------- Zijbalk ---------- */
  aside { position: relative; z-index: 500; min-width: 0; overflow: hidden; background: #fff; border-right: 1px solid var(--line); }
  .side { position: relative; width: var(--side); height: 100%; display: flex; flex-direction: column; }
  header { padding: 18px 12px 12px 20px; display: flex; align-items: flex-start; gap: 8px; }
  header div { flex: 1; }
  header h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 24px; margin: 0; letter-spacing: -.5px; }
  header h1 span { color: var(--sun); }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .handle { display: none; }

  .icon-btn { flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }

  .toolbar { padding: 0 20px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .control {
    height: 40px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
    display: flex; align-items: center; transition: border-color .15s, background .15s;
  }
  .control:hover { border-color: #cfd4da; background: #fff; }
  .search { padding: 0 12px; gap: 8px; cursor: text; }
  .search svg { flex: none; color: var(--muted); }
  .search input { border: 0; outline: 0; background: none; font: inherit; font-size: 14px; width: 100%; color: var(--ink); -webkit-appearance: none; appearance: none; }
  .search:focus-within { border-color: var(--ink); background: #fff; }

  .stepper { flex: none; padding: 0 4px; gap: 2px; }
  .stepper button {
    width: 30px; height: 30px; border: 0; border-radius: 9px; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.1); font-size: 17px; line-height: 1; display: grid; place-items: center; transition: background .12s, color .12s;
  }
  .stepper button:hover { background: var(--ink); color: #fff; }
  .stepper output { min-width: 62px; text-align: center; font-weight: 600; font-size: 14px; }

  .dd { position: relative; flex: 1; min-width: 0; }
  .dd > .control { width: 100%; padding: 0 10px 0 12px; justify-content: space-between; gap: 6px; font-size: 14px; font-weight: 500; text-align: left; }
  .dd > .control span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd > .control svg { flex: none; color: var(--muted); transition: transform .15s; }
  .dd.open > .control { border-color: var(--ink); background: #fff; }
  .dd.open > .control svg { transform: rotate(180deg); }
  .dd-menu {
    position: absolute; z-index: 1000; top: calc(100% + 6px); left: 0; min-width: 100%; width: max-content; max-width: 260px;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 14px 34px rgba(0,0,0,.15);
    padding: 5px; display: none;
  }
  .dd.open .dd-menu { display: block; animation: pop .12s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .dd-opt { display: flex; width: 100%; gap: 16px; justify-content: space-between; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-align: left; }
  .dd-opt:hover { background: var(--bg); }
  .dd-opt.on { font-weight: 600; }
  .dd-opt.on::after { content: '✓'; color: var(--sun); }

  .btn { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .badge { background: var(--sun); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 6px; }
  .badge:empty { display: none; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pills:empty { display: none; }
  .pill { font-size: 12px; font-weight: 500; padding: 4px 8px 4px 10px; border-radius: 999px; background: #eef0f2; border: 0; display: inline-flex; gap: 6px; align-items: center; }
  .pill::after { content: '×'; color: var(--muted); font-size: 15px; line-height: 1; }
  .pill:hover { background: var(--line); }
  .pill:hover::after { color: var(--ink); }

  .bar { padding: 8px 14px 8px 20px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .bar b { color: var(--ink); }
  .link { border: 0; background: none; padding: 5px 8px; border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .link:hover { background: var(--bg); }
  .link.on { color: var(--sun); }

  /* ---------- Lijst ---------- */
  .list { flex: 1; overflow-y: auto; padding: 10px 12px 24px; background: var(--bg); overscroll-behavior: contain; }
  .ext { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 4px 2px; }
  .ext a { text-decoration: none; font-weight: 600; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .ext a:hover { border-color: var(--ink); }
  .card { position: relative; display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px; border-radius: 14px; cursor: pointer; margin-top: 8px; background: #fff; border: 1px solid var(--line); transition: border-color .12s, box-shadow .12s; }
  .card:hover, .card.hover { border-color: #c3c9d0; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card.active { border-color: var(--ink); }
  .card img { width: 112px; height: 100px; object-fit: cover; border-radius: 10px; background: var(--line); }
  .card h3 { margin: 1px 30px 2px 0; font-size: 15px; font-weight: 700; }
  .meta { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .meta b, .meta .src { color: var(--ink); font-weight: 600; }
  .fav { position: absolute; top: 5px; right: 5px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; font-size: 18px; line-height: 1; color: #d0d4d9; }
  .fav:hover { background: var(--bg); color: var(--muted); }
  .fav.on, .fav.on:hover { color: var(--sun); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin: 4px 3px 0 0; background: #f0f2f4; color: var(--muted); }
  .tag.ok { background: #e3f4ec; color: var(--ok); }
  .tag.warn { background: #fbefe0; color: var(--warn); }
  .tag.bad { background: #f8e3e1; color: var(--bad); }
  .tag.lux { background: #f6eed9; color: #94701f; }
  .tag.fresh { background: #e3effa; color: #1d6aa5; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  .empty .btn { margin-top: 12px; }

  /* ---------- Panelen (filters & details) ---------- */
  .panel { position: absolute; inset: 0; z-index: 20; background: #fff; display: flex; flex-direction: column;
    transform: translateX(-100%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
  .panel.open { transform: none; visibility: visible; transition: transform .22s ease; }
  .panel-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 8px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .panel-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .panel-foot { display: flex; gap: 8px; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .primary { flex: 1; min-height: 44px; border: 0; border-radius: var(--radius); background: var(--ink); color: #fff; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 14px; }
  .primary:hover { background: #000; }
  .primary.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .primary.ghost:hover { border-color: var(--ink); }
  .primary small { font-weight: 500; opacity: .7; }

  .filters section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .panel h5 { margin: 0 0 10px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; transition: border-color .12s; }
  .chip small { color: var(--muted); margin-left: 5px; font-size: 11px; }
  .chip:hover { border-color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.on small { color: #c5cbd2; }
  .switch { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border: 0; background: none; text-align: left; font-size: 14px; }
  .switch small { display: block; font-size: 12px; color: var(--muted); }
  .switch i { flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
  .switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch[aria-pressed=true] i { background: var(--ink); }
  .switch[aria-pressed=true] i::after { transform: translateX(16px); }
  .switch.gold[aria-pressed=true] i { background: var(--gold); }

  .gallery-wrap { position: relative; background: var(--line); }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; flex: none; scroll-snap-align: start; }
  .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 18px; line-height: 1; }
  .gallery-nav.prev { left: 10px; }
  .gallery-nav.next { right: 10px; }
  .gallery-count { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .detail-content { padding: 16px 20px 24px; }
  .detail-title { position: relative; padding-right: 36px; }
  .detail-title h3 { margin: 0; font-size: 22px; letter-spacing: -.3px; }
  .detail-title .fav { top: -4px; right: -8px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin: 14px 0 6px; }
  .facts div { background: var(--bg); border-radius: var(--radius); padding: 10px 6px; text-align: center; font-size: 11px; color: var(--muted); }
  .facts b { display: block; font-size: 17px; color: var(--ink); }
  .detail section { margin-top: 20px; }
  .rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; }
  .rows span:nth-child(odd) { color: var(--muted); }
  .detail .panel-foot { flex-direction: column; align-items: stretch; }
  .detail .panel-foot > small { color: var(--muted); font-size: 11.5px; text-align: center; }

  /* ---------- Kaart ---------- */
  #map { height: 100%; background: #1d2a2f; z-index: 0; }
  .leaflet-div-icon { background: none; border: none; }
  .pin {
    position: absolute; transform: translate(-50%, -50%); background: #fff; color: var(--ink);
    font: 700 12px Inter, sans-serif; border-radius: 999px; padding: 4px 9px 4px 7px; white-space: nowrap;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 3px 12px rgba(0,0,0,.25); transition: transform .12s;
  }
  .pin svg { flex: none; opacity: .75; }
  .pin:hover, .pin.hover { transform: translate(-50%, -50%) scale(1.15); background: var(--ink); color: #fff; }
  .pin.lux::after { content: '◆'; color: var(--gold); font-size: 9px; }
  .pin.fav { background: var(--sun); color: #fff; }
  .pin.fav.lux::after { color: #fff; }
  .pin.active { background: var(--ink); color: #fff; transform: translate(-50%, -50%) scale(1.2); }
  .place { position: absolute; transform: translate(-50%, -50%); font: 600 11px Inter, sans-serif; color: #0b4f6c; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .is-sat .place { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.9); }

  .seg { display: flex; background: #fff; border-radius: 12px; padding: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
  .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .side-open { display: none; align-items: center; gap: 8px; height: 42px; padding: 0 14px 0 10px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.2); font-weight: 600; font-size: 14px; }
  .side-open:hover { background: var(--bg); }
  .app.collapsed .side-open { display: inline-flex; }
  .leaflet-bar { border: 0 !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.2) !important; }
  .leaflet-bar a { width: 36px !important; height: 36px !important; line-height: 36px !important; color: var(--ink) !important; border-color: var(--line) !important; }
  .leaflet-control-attribution { font-size: 10px; }

  .toast { position: fixed; left: 50%; top: 16px; z-index: 2000; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--radius); font-size: 14px; transition: .2s; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Mobiel: zijbalk wordt een sheet over de kaart ---------- */
  @media (max-width: 800px) {
    :root { --side: 100%; }
    .app { display: block; }
    #map { position: fixed; inset: 0; }
    aside {
      position: fixed; left: 0; right: 0; bottom: 0; height: 64dvh; border: 0; border-radius: 18px 18px 0 0;
      box-shadow: 0 -6px 24px rgba(0,0,0,.18); transition: transform .28s ease, height .28s ease, border-radius .28s;
    }
    .app.collapsed aside { transform: translateY(calc(100% - 64px - env(safe-area-inset-bottom))); }
    .app.panel-open aside { height: 100dvh; border-radius: 0; }
    .side { width: 100%; }
    header { display: none; }
    .handle { display: flex; flex-direction: column; align-items: stretch; flex: none; height: 64px; padding: 8px 16px 0; border: 0; background: none; text-align: left; }
    .handle::before { content: ''; align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #d5d9de; margin-bottom: 10px; }
    .handle span { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    .handle em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--muted); }
    .toolbar { padding: 0 14px 10px; }
    .bar { padding: 6px 8px 6px 14px; justify-content: flex-end; }
    .bar #count { display: none; }
    .list { padding: 4px 10px calc(24px + env(safe-area-inset-bottom)); }
    .side-open { display: none !important; }
    .leaflet-bottom { bottom: calc(64px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="side">
      <button type="button" class="handle" id="handle" aria-label="Lijst in- of uitklappen">
        <span><b id="handleCount"></b><em id="handleHint"></em></span>
      </button>
      <header>
        <div>
          <h1>Lloret <span>Huiszoeker</span></h1>
          <p>24 – 31 juli · villa's van meerdere aanbieders</p>
        </div>
        <button type="button" class="icon-btn" id="collapse" title="Zijbalk inklappen" aria-label="Zijbalk inklappen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </header>
      <div class="toolbar">
        <label class="control search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="text" placeholder="Naam, wijk, plaats of aanbieder" autocomplete="off" spellcheck="false" aria-label="Zoeken">
        </label>
        <div class="row">
          <div class="control stepper" id="stepper" aria-label="Minimaal aantal personen">
            <button type="button" data-step="-1" aria-label="Minder personen">−</button>
            <output id="persons"></output>
            <button type="button" data-step="1" aria-label="Meer personen">+</button>
          </div>
          <div class="dd" id="sort"></div>
          <button type="button" class="btn" id="openFilters">Filters <span class="badge" id="filterCount"></span></button>
        </div>
        <div class="pills" id="pills"></div>
      </div>
      <div class="bar">
        <span id="count"></span>
        <span>
          <button type="button" class="link" id="favToggle"></button>
          <button type="button" class="link" id="share">Delen</button>
        </span>
      </div>
      <div class="list">
        <div class="ext" id="ext"></div>
        <div id="list"></div>
      </div>

      <div class="panel filters" id="filters">
        <div class="panel-head">
          <button type="button" class="icon-btn" data-close aria-label="Sluiten">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <h2>Filters</h2>
        </div>
        <div class="panel-body" id="filterBody"></div>
        <div class="panel-foot">
          <button type="button" class="link" id="clear">Alles wissen</button>
          <button type="button" class="primary" data-close id="apply"></button>
        </div>
      </div>

      <div class="panel detail" id="detail">
        <div class="panel-head">
          <button type="button" class="icon-btn" data-close aria-label="Terug naar lijst">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h2>Terug naar lijst</h2>
        </div>
        <div class="panel-body" id="detailBody"></div>
        <div class="panel-foot" id="detailFoot"></div>
      </div>
    </div>
  </aside>
  <div id="map"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>

  rating: ['Beste beoordeling', (a, b) => (b.rating || 0) - (a.rating || 0) || b.reviews - a.reviews],
  privacy: ['Meeste privacy', (a, b) => (b.scores.privacy || 0) - (a.scores.privacy || 0)],
  bedrooms: ['Meeste slaapkamers', (a, b) => (b.bedrooms || 0) - (a.bedrooms || 0)],
};
const DISTANCES = { 0: 'Maakt niet uit', 500: '500 m', 1000: '1 km', 2000: '2 km', 3000: '3 km', 5000: '5 km' };
const BED_NAMES = { Single: 'enkel', Double: 'dubbel', King: 'kingsize', Queen: 'queen', SofaBed: 'slaapbank', Bunk: 'stapelbed' };
const DEFAULTS = { q: '', persons: 12, sort: 'persons', town: '', friends: true, maxBeach: 0, maxNight: 0, lux: false, modern: false, extra: false, favs: false };
const MODERN_MIN = 4;  // stijlscore uit de fotobeoordeling (1-5)
const BED_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></svg>';
const CHEVRON ='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { ...DEFAULTS, need: new Set(), sources: new Set(), active: null };
const favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
const saveFavs = () => localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
const isMobile = () => matchMedia('(max-width: 800px)').matches;

function meters(a, b) {
  const r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(x));
}
const fmtM = m => m < 1000 ? `${Math.round(m / 50) * 50} m` : `${(m / 1000).toFixed(1)} km`;
const stars = n => n ? '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n)) : '';
const persons = h => `${h.persons}${h.personsMax > h.persons ? `–${h.personsMax}` : ''}`;
const beachText = h => `${h.beachApprox ? '~' : ''}${fmtM(h.beachM)}`;
const housesText = n => `${n} ${n === 1 ? 'huis' : 'huizen'}`;

const houses = window.HOUSES.map(h => {
  const sources = h.offers.map(o => o.source);
  return {
    ...h,
    sources,
    beachM: h.dist.beach ?? Math.round(Math.min(...BEACHES.map(b => meters([h.lat, h.lng], b)))),
    beachApprox: h.dist.beach == null,
    nightM: h.dist.nightlife ?? null,
    haystack: `${h.name} ${h.area} ${h.town} ${sources.join(' ')}`.toLowerCase(),
  };
});
const byId = Object.fromEntries(houses.map(h => [h.id, h]));
const towns = [...new Set(houses.map(h => h.town))].sort();
const sourceNames = [...new Set(houses.flatMap(h => h.sources))].sort();

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

const modernTag = h => (h.modern || 0) >= MODERN_MIN ? `<span class="tag fresh">✦ Modern</span>` : '';

function groupTag(h) {
  const age = h.minAge ? ` · gem. ${h.minAge}+` : '';
  switch (h.groups) {
    case 'groepen ok': return `<span class="tag ok">Groepen welkom${age}</span>`;
    case 'gemengde groepen': return `<span class="tag warn">Alleen gemengde groepen${age}</span>`;
    case 'geen groepen': return `<span class="tag bad">Geen groepen</span>`;
    default: return `<span class="tag">Groepsbeleid: check site</span>`;
  }
}

// override: doe alsof een filter anders staat (voor de aantallen in het filterpaneel)
function filtered(override = {}) {
  const s = { ...state, ...override };
  const q = s.q.trim().toLowerCase();
  return houses.filter(h =>
    (s.extra ? h.personsMax : h.persons) >= s.persons &&
    (!s.town || h.town === s.town) &&
    (!s.friends || h.groups !== 'geen groepen') &&
    (!s.lux || h.luxury) &&
    (!s.modern || (h.modern || 0) >= MODERN_MIN) &&
    (!s.favs || favs.has(h.id)) &&
    (!s.maxBeach || h.beachM <= s.maxBeach) &&
    (!s.maxNight || (h.nightM != null && h.nightM <= s.maxNight)) &&
    [...s.need].every(f => h.features.includes(f)) &&
    (!s.sources.size || h.sources.some(src => s.sources.has(src))) &&
    (!q || h.haystack.includes(q))
  );
}

// Filters die de lijst inperken, met een functie om ze weer uit te zetten
function activeFilters() {
  const list = [];
  if (state.town) list.push([state.town, () => state.town = '']);
  state.sources.forEach(s => list.push([s, () => state.sources.delete(s)]));
  if (state.friends) list.push(['Vriendengroep mag', () => state.friends = false]);
  if (state.lux) list.push(['Alleen luxe', () => state.lux = false]);
  if (state.modern) list.push(['Modern & fris', () => state.modern = false]);
  if (state.maxBeach) list.push([`Strand ≤ ${DISTANCES[state.maxBeach]}`, () => state.maxBeach = 0]);
  if (state.maxNight) list.push([`Uitgaan ≤ ${DISTANCES[state.maxNight]}`, () => state.maxNight = 0]);
  if (state.extra) list.push(['Incl. extra bedden', () => state.extra = false]);
  state.need.forEach(f => list.push([FEATURES[f], () => state.need.delete(f)]));
  return list;
}

// ---------- Sorteer-dropdown ----------
const sortDd = $('#sort');
function drawSort() {
  sortDd.innerHTML = `
    <button type="button" class="control" aria-haspopup="listbox"><span>${SORTS[state.sort][0]}</span>${CHEVRON}</button>
    <div class="dd-menu" role="listbox">${Object.entries(SORTS).map(([k, [label]]) =>
      `<button type="button" role="option" class="dd-opt ${k === state.sort ? 'on' : ''}" data-value="${k}">${label}</button>`).join('')}
    </div>`;
}
sortDd.addEventListener('click', e => {
  const opt = e.target.closest('.dd-opt');

    drawSort();
    render(false);

// ---------- Kaart ----------
const map = L.map('map', { zoomControl: false }).setView([41.703, 2.845], 14);
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services';
const baseLayers = {
  sat: L.layerGroup([
    L.tileLayer(`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 19, maxNativeZoom: 18, attribution: 'Luchtfoto&#39;s &copy; Esri, Maxar, Earthstar Geographics' }),
    L.tileLayer(`${ESRI}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 19, maxNativeZoom: 18 }),
  ]),
  map: L.tileLayer(`https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }),
};

function setLayer(name) {
  Object.values(baseLayers).forEach(layer => map.removeLayer(layer));
  baseLayers[name].addTo(map);
  localStorage.setItem(LAYER_KEY, name);
  map.getContainer().classList.toggle('is-sat', name === 'sat');
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.layer === name));
}

const control = (position, className, html, onClick) => new (L.Control.extend({
  options: { position },
  onAdd() {
    const el = L.DomUtil.create(className === 'side-open' ? 'button' : 'div', className);
    el.innerHTML = html;
    L.DomEvent.disableClickPropagation(el);
    el.addEventListener('click', onClick);
    return el;
  },
}))();

control('topleft', 'side-open',
  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span id="openCount"></span>',
  () => setCollapsed(false)).addTo(map);
control('topright', 'seg', '<button type="button" data-layer="sat">Satelliet</button><button type="button" data-layer="map">Kaart</button>', e => {
  const b = e.target.closest('button');
  if (b) setLayer(b.dataset.layer);
}).addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);
setLayer(baseLayers[localStorage.getItem(LAYER_KEY)] ? localStorage.getItem(LAYER_KEY) : 'sat');
L.marker(BEACHES[0], { icon: L.divIcon({ html: '<div class="place">Platja de Lloret</div>' }), interactive: false }).addTo(map);

function pinIcon(h) {
  const cls = ['pin', h.luxury && 'lux', favs.has(h.id) && 'fav', state.active === h.id && 'active'].filter(Boolean).join(' ');
  return L.divIcon({ html: `<div class="${cls}">${BED_ICON}${h.persons}</div>`, iconSize: [0, 0] });
}

const markers = {};
const cardEl = id => document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);

function hover(id, on) {
  markers[id]?.getElement()?.firstElementChild?.classList.toggle('hover', on);
  markers[id]?.setZIndexOffset(on ? 1000 : 0);
  cardEl(id)?.classList.toggle('hover', on);
}

function setActive(id) {
  const prev = state.active;
  state.active = id;
  [prev, id].forEach(x => x && markers[x]?.setIcon(pinIcon(byId[x])));
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.dataset.id === id));
}

// Op mobiel ligt de sheet over de kaart; houd de pins daarboven in beeld
function fitOptions() {
  const sheet = isMobile() ? (state.collapsed ? 64 : $('aside').offsetHeight) : 0;
  return { paddingTopLeft: [50, 60], paddingBottomRight: [50, sheet + 40], maxZoom: 16 };
}

// ---------- Zijbalk in- en uitklappen ----------
function setCollapsed(collapsed, remember = true) {
  state.collapsed = collapsed;
  $('#app').classList.toggle('collapsed', collapsed);
  if (collapsed) closePanels();
  if (remember) localStorage.setItem(SIDE_KEY, collapsed ? '1' : '');
  updateHandle();
  // Na de animatie weet Leaflet pas hoe groot de kaart is
  clearTimeout(setCollapsed.timer);
  setCollapsed.timer = setTimeout(() => map.invalidateSize({ pan: false }), 300);
}

function updateHandle() {
  const n = filtered().length;
  $('#handleCount').textContent = housesText(n);
  $('#handleHint').textContent = state.collapsed ? 'Lijst tonen ▴' : 'Kaart tonen ▾';
  $('#openCount').textContent = `Lijst · ${n}`;
}

$('#collapse').addEventListener('click', () => setCollapsed(true));
$('#handle').addEventListener('click', () => setCollapsed(!state.collapsed));

// ---------- Details ----------
function detailHtml(h) {
  const beds = Object.entries(h.beds).map(([k, v]) => `${v}× ${BED_NAMES[k] || k}`).join(', ');
  const row = (label, v) => v ? `<span>${label}</span><span>${esc(v)}</span>` : '';
  const fact = (v, label) => v ? `<div><b>${v}</b>${label}</div>` : '';
  const feats = Object.entries(FEATURES).filter(([k]) => h.features.includes(k));
  const houseRows = [
    row('Stijl', h.modern && `${h.modern}/5 modern${h.modernNote ? ` · ${h.modernNote}` : ''}`),
    row('Bedden', beds),
    row('Eettafel', h.seats.replace(/^Ja,?\s*/, '')),
    row('Airco', h.airco && (h.airco.replace(/^Ja,?\s*/, '') || 'ja')),
    row('Privacy', stars(h.scores.privacy)),
    row('Uitzicht', stars(h.scores.view)),
    row('Reviews', h.rating && `★ ${h.rating} / 5 (${h.reviews})`),
  ].join('');
  return `
    <div class="gallery-wrap">
      <div class="gallery">${h.images.map(i => `<img loading="lazy" src="${esc(i)}" alt="">`).join('')}</div>
      ${h.images.length > 1 ? `
        <button type="button" class="gallery-nav prev" data-slide="-1" aria-label="Vorige foto">‹</button>
        <button type="button" class="gallery-nav next" data-slide="1" aria-label="Volgende foto">›</button>
        <span class="gallery-count">1 / ${h.images.length}</span>` : ''}
    </div>
    <div class="detail-content">
      <div class="detail-title">
        <h3>${esc(h.name)}</h3>
        <button type="button" class="fav ${favs.has(h.id) ? 'on' : ''}" data-fav="${esc(h.id)}" aria-label="Favoriet">★</button>
      </div>
      <div class="meta">${esc([h.area, h.town].filter(Boolean).join(' · '))}</div>
      <div class="facts">
        ${fact(persons(h), 'personen')}${fact(h.bedrooms, 'slaapkamers')}${fact(h.bathrooms, 'badkamers')}${fact(h.m2, 'm²')}
      </div>
      ${h.luxury ? '<span class="tag lux">Luxe</span>' : ''}${modernTag(h)}${groupTag(h)}
      <section>
        <h5>Afstanden</h5>
        <div class="rows">
          ${row('Strand', `${beachText(h)}${h.beachApprox ? ' (hemelsbreed)' : ''}`)}
          ${row('Uitgaan', h.nightM != null && fmtM(h.nightM))}
          ${row('Supermarkt', h.dist.supermarket != null && fmtM(h.dist.supermarket))}
          ${row('Restaurant', h.dist.restaurant != null && fmtM(h.dist.restaurant))}
          ${row('Vliegveld', h.dist.airport != null && fmtM(h.dist.airport))}
        </div>
      </section>
      ${houseRows ? `<section><h5>Het huis</h5><div class="rows">${houseRows}</div></section>` : ''}
      ${feats.length ? `<section><h5>Voorzieningen</h5>${feats.map(([, label]) => `<span class="tag">${label}</span>`).join('')}</section>` : ''}
    </div>`;
}

function openDetail(id) {
  const h = byId[id];
  setActive(id);
  $('#detailBody').innerHTML = detailHtml(h);
  $('#detailBody').scrollTop = 0;
  $('#detailFoot').innerHTML = h.offers.map((o, i) => `
    <a class="primary ${i ? 'ghost' : ''}" href="${esc(o.url)}" target="_blank" rel="noopener">
      Bekijk bij ${esc(o.source)} →${o.price ? `<small>${esc(o.price)}</small>` : ''}
    </a>`).join('') + '<small>Check beschikbaarheid voor 24–31 juli op de site van de aanbieder</small>';
  $('#filters').classList.remove('open');
  $('#detail').classList.add('open');
  $('#app').classList.add('panel-open');
  if (state.collapsed) setCollapsed(false, false);
  if (!isMobile()) map.setView(markers[id].getLatLng(), Math.max(map.getZoom(), 16));
}

function closePanels() {
  const id = $('#detail').classList.contains('open') && state.active;
  document.querySelectorAll('.panel.open').forEach(p => p.classList.remove('open'));
  $('#app').classList.remove('panel-open');
  if (id) {
    setActive(null);
    cardEl(id)?.scrollIntoView({ block: 'nearest' });
  }
}

$('#detailBody').addEventListener('click', e => {
  const nav = e.target.closest('[data-slide]');
  if (!nav) return;
  const g = $('#detailBody .gallery');
  g.scrollBy({ left: g.clientWidth * nav.dataset.slide, behavior: 'smooth' });
});
$('#detailBody').addEventListener('scroll', e => {
  if (!e.target.classList?.contains('gallery')) return;
  const g = e.target;
  $('#detailBody .gallery-count').textContent = `${Math.round(g.scrollLeft / g.clientWidth) + 1} / ${g.children.length}`;
}, true);

// ---------- Filterpaneel ----------
function renderFilters(total) {
  const chip = (attr, value, label, on, n) =>
    `<button type="button" class="chip ${on ? 'on' : ''}" data-${attr}="${esc(value)}">${esc(label)}${n != null ? `<small>${n}</small>` : ''}</button>`;
  const dist = (attr, key) => Object.entries(DISTANCES).map(([v, label]) =>
    chip(attr, v, label, state[key] === +v, +v ? filtered({ [key]: +v }).length : null)).join('');
  const toggle = (key, label, hint, cls = '') =>
    `<button type="button" class="switch ${cls}" data-toggle="${key}" aria-pressed="${state[key]}"><span>${label}<small>${hint}</small></span><i></i></button>`;
  const features = Object.entries(FEATURES).map(([k, label]) => {
    const on = state.need.has(k);
    const n = filtered({ need: new Set([...state.need, k]) }).length;
    return on || n ? chip('feature', k, label, on, on ? null : n) : '';
  }).join('');

  $('#filterBody').innerHTML = `
    <section><h5>Plaats</h5><div class="chips">
      ${chip('town', '', 'Overal', !state.town, filtered({ town: '' }).length)}
      ${towns.map(t => [t, filtered({ town: t }).length]).filter(([t, n]) => n || state.town === t)
        .map(([t, n]) => chip('town', t, t, state.town === t, n)).join('')}
    </div></section>
    <section><h5>Groep</h5>
      ${toggle('friends', 'Vriendengroep mag', 'Verberg huizen die geen groepen toelaten')}
      ${toggle('lux', 'Alleen luxe villa\'s', 'Huizen die de aanbieder als luxe aanmerkt', 'gold')}
      ${toggle('modern', 'Modern & fris', `Op basis van de foto's: strak, nieuw of recent gerenoveerd (${filtered({ modern: true }).length})`)}
      ${toggle('extra', 'Extra bedden meetellen', 'Tel slaapbanken en bijzetbedden mee bij het aantal personen')}
    </section>
    <section><h5>Afstand tot strand</h5><div class="chips">${dist('beach', 'maxBeach')}</div></section>
    <section><h5>Afstand tot uitgaan</h5><div class="chips">${dist('night', 'maxNight')}</div></section>
    <section><h5>Aanbieders</h5><div class="chips">
      ${sourceNames.map(s => chip('source', s, s, state.sources.has(s), filtered({ sources: new Set([s]) }).length)).join('')}
    </div></section>
    <section><h5>Voorzieningen</h5><div class="chips">${features || '<span class="meta">Geen voorzieningen bij deze selectie</span>'}</div></section>`;
  $('#apply').textContent = total ? `Toon ${housesText(total)}` : 'Geen huizen, zet wat filters uit';
}

$('#filterBody').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  const flip = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
  if (d.town != null) state.town = d.town;
  if (d.beach != null) state.maxBeach = +d.beach;
  if (d.night != null) state.maxNight = +d.night;
  if (d.toggle) state[d.toggle] = !state[d.toggle];
  if (d.feature) flip(state.need, d.feature);
  if (d.source) flip(state.sources, d.source);
  const scroll = $('#filterBody').scrollTop;
  render(true);
  $('#filterBody').scrollTop = scroll;
});

$('#clear').addEventListener('click', () => {
  Object.assign(state, { town: '', friends: false, lux: false, modern: false, maxBeach: 0, maxNight: 0, extra: false });
  state.need.clear();
  state.sources.clear();
  render(true);
});

let removers = [];

function cardHtml(h) {
  return `
    <article class="card ${state.active === h.id ? 'active' : ''}" data-id="${esc(h.id)}">
      <img loading="lazy" src="${esc(h.images[0] || '')}" alt="">
      <div>
        <h3>${esc(h.name)}</h3>

          <span class="src">${esc(h.sources.join(' · '))}</span>${h.price ? ` · ${esc(h.price)}` : ''}

function renderExternal() {
  const n = state.persons;
  // Grote groep: hele woning, zwembad (Airbnb-voorziening 7 / Booking-faciliteit 433) en ~2 personen per slaapkamer
  const rooms = Math.ceil(n / 2);
  const links = {
    Airbnb: `https://www.airbnb.nl/s/Lloret-de-Mar--Spanje/homes?checkin=${TRIP.checkin}&checkout=${TRIP.checkout}&adults=${n}&room_types%5B%5D=Entire%20home%2Fapt&min_bedrooms=${rooms}&amenities%5B%5D=7`,
    'Airbnb gastfavorieten': `https://www.airbnb.nl/s/Lloret-de-Mar--Spanje/homes?checkin=${TRIP.checkin}&checkout=${TRIP.checkout}&adults=${n}&room_types%5B%5D=Entire%20home%2Fapt&min_bedrooms=${rooms}&amenities%5B%5D=7&guest_favorite=true`,
    Booking: `https://www.booking.com/searchresults.nl.html?ss=Lloret+de+Mar&checkin=${TRIP.checkin}&checkout=${TRIP.checkout}&group_adults=${n}&no_rooms=1&nflt=ht_id%3D213%3Bhotelfacility%3D433`,
    Vrbo: `https://www.vrbo.com/search?destination=Lloret%20de%20Mar%2C%20Spain&startDate=${TRIP.checkin}&endDate=${TRIP.checkout}&adults=${n}`,
  };
  $('#ext').innerHTML = `<span>Ook zoeken op</span>` +
    Object.entries(links).map(([name, url]) => `<a href="${url}" target="_blank" rel="noopener">${name} ↗</a>`).join('');
}

function render(fit) {
  const list = filtered().sort(SORTS[state.sort][1]);
  const ids = new Set(list.map(h => h.id));

  for (const [id, m] of Object.entries(markers)) {
    if (!ids.has(id)) { map.removeLayer(m); delete markers[id]; }
  }
  for (const h of list) {
    if (markers[h.id]) { markers[h.id].setIcon(pinIcon(h)); continue; }
    markers[h.id] = L.marker([h.lat, h.lng], { icon: pinIcon(h), riseOnHover: true })
      .on('click', () => openDetail(h.id))
      .on('mouseover', () => hover(h.id, true))
      .on('mouseout', () => hover(h.id, false))
      .addTo(map);
  }

  const active = activeFilters();
  removers = active.map(([, remove]) => remove);
  $('#pills').innerHTML = active.map(([label], i) =>
    `<button type="button" class="pill" data-remove="${i}" title="Filter weghalen">${esc(label)}</button>`).join('');
  $('#filterCount').textContent = active.length || '';
  $('#persons').textContent = `${state.persons}+ pers.`;
  $('#count').innerHTML = `<b>${list.length}</b> ${list.length === 1 ? 'huis' : 'huizen'}`;
  $('#favToggle').textContent = `★ Favorieten${favs.size ? ` (${favs.size})` : ''}`;
  $('#favToggle').classList.toggle('on', state.favs);
  updateHandle();
  renderExternal();

  $('#list').innerHTML = list.map(cardHtml).join('') || `
    <div class="empty">
      ${state.favs && !favs.size ? 'Nog geen favorieten. Tik op ★ bij een huis.' : 'Geen huizen met deze filters.'}
      <br><button type="button" class="btn" id="emptyReset">Filters wissen</button>
    </div>`;

  if ($('#filters').classList.contains('open')) renderFilters(list.length);
  if (fit && list.length) map.fitBounds(L.latLngBounds(list.map(h => [h.lat, h.lng])), fitOptions());
}

function resetAll() {
  Object.assign(state, DEFAULTS);
  state.need.clear();
  state.sources.clear();
  $('#q').value = '';
  drawSort();
  render(true);
}

$('#list').addEventListener('click', e => {
  if (e.target.closest('#emptyReset')) return resetAll();
  const card = e.target.closest('.card');
  if (card && !e.target.closest('[data-fav]')) openDetail(card.dataset.id);
});
$('#list').addEventListener('mouseover', e => {
  const card = e.target.closest('.card');
  if (card && !card.contains(e.relatedTarget)) hover(card.dataset.id, true);
});
$('#list').addEventListener('mouseout', e => {
  const card = e.target.closest('.card');
  if (card && !card.contains(e.relatedTarget)) hover(card.dataset.id, false);
});

// Favorieten kunnen in de lijst én in de details aangetikt worden
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-fav]');
  if (!btn) return;
  const id = btn.dataset.fav;
  const on = !favs.has(id);
  on ? favs.add(id) : favs.delete(id);
  saveFavs();
  document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b => b.classList.toggle('on', on));
  render(false);
  toast(on ? `${byId[id].name} bij favorieten gezet` : `${byId[id].name} uit favorieten gehaald`);
});

$('#pills').addEventListener('click', e => {
  const pill = e.target.closest('[data-remove]');
  if (!pill) return;
  removers[pill.dataset.remove]();
  render(true);
});

$('#q').addEventListener('input', e => { state.q = e.target.value; render(true); });
$('#stepper').addEventListener('click', e => {
  const b = e.target.closest('[data-step]');
  if (!b) return;
  state.persons = Math.min(40, Math.max(1, state.persons + +b.dataset.step));
  render(true);
});
$('#favToggle').addEventListener('click', () => { state.favs = !state.favs; render(true); });

$('#openFilters').addEventListener('click', () => {
  $('#detail').classList.remove('open');
  setActive(null);
  $('#filters').classList.add('open');
  $('#app').classList.add('panel-open');
  render(false);
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closePanels));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (sortDd.classList.contains('open')) sortDd.classList.remove('open');
  else if (document.querySelector('.panel.open')) closePanels();
});
addEventListener('resize', () => map.invalidateSize());

// Delen: een link met de favorieten erin, zodat vrienden precies dezelfde selectie op de kaart zien
$('#share').addEventListener('click', async () => {
  const picked = houses.filter(h => favs.has(h.id));
  if (!picked.length) return toast('Markeer eerst een paar huizen met ★');
  const url = `${location.origin}${location.pathname}?favs=${picked.map(h => encodeURIComponent(h.id)).join(',')}`;
  const lines = picked.map(h => `★ ${h.name} (${persons(h)} pers.)`).join('\n');
  const text = `Onze favorieten voor Lloret, 24–31 juli:\n${lines}\n\nBekijk ze op de kaart: ${url}`;
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ text }); } catch {}
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('Gekopieerd! Plak het in de groepsapp.');
  } catch {
    prompt('Kopieer deze tekst:', text);
  }
});

const shared = new URLSearchParams(location.search).get('favs')?.split(',').filter(id => byId[id]);
if (shared?.length) {
  shared.forEach(id => favs.add(id));
  saveFavs();
  Object.assign(state, { favs: true, friends: false, persons: 1 });
  history.replaceState(null, '', location.pathname);
}

drawSort();
setCollapsed(!!localStorage.getItem(SIDE_KEY) && !shared?.length, false);
render(true);
if (shared?.length) toast(`${shared.length} gedeelde ${shared.length === 1 ? 'favoriet' : 'favorieten'} geladen`);
</script>
</body>
</html>
